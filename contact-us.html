<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="./style.css">
</head>

<body>
    <nav class="navbar">
        <div class="logo">
            <a href="./play.html"><img src="./pictures/download.jpg" alt="Dot Link Logo"></a>
            <span>Dot Link</span>
        </div>

        <ul class="nav-links">
            <li><a href="./home.html">Home</a></li>
            <li><a href="./play.html">Play</a></li>
            <li><a href="./contact-us.html">Contact Us</a></li>

        </ul>

    </nav>

    <main class="contact-page">
        <section class="contact-us-banner">
            <div class="contact-us-background">
                <img src="./pictures/background.png" alt="Dot Link Background">
            </div>
            <div class="banner-message">
                <h1>We'd love to hear from you</h1>
                <p>Whether you have any questions or bugs or anything else, please contact our team.</p>
            </div>
        </section>

        <div class="contact-us-container">
            <h1>CONTACT US</h1>
            <ul class="contact-us-details">
                <li>Phone Number: +973 12345678</li>
                <li>Email: support@dotlinkgame.com</li>
                <li>Instagram: dotlink</li>
            </ul>
        </div>

        <div class="contact-us-form">
            <h3>Get in touch with us</h3>
            <form class="form" action="#" method="post">
                <input type="text" name="firstName" placeholder="First Name" required>
                <input type="text" name="lastName" placeholder="Last Name" required>
        </div>
        <div>
            <input type="email" name="email" placeholder="Email" required>
        </div>
        <div>
            <select name="queryType" required>
                <option value="" disabled section>Type your inquery</option>
                <option value="bug">Report a Bug</option>
                <option value="feedback">Game Feedback</option>
                <option value="support">Technical Support</option>
                <option value="other">Other</option>
            </select>
        </div>
        <div>
            <input type="number" name="phoneNumber" placeholder="Phone Number">
        </div>
        <div>
            <textarea name="message" rows=4 placeholder="Your message" required>
            </textarea>
        </div>
        <div>
            <button type="submit" class="btn-submit">Submit</button>
        </div>
        </form>

    </main>



</body>

</html>
